name: Keep Streamlit App Awake 24/7

on:
  schedule:
    # Run every 6 hours (Streamlit Community Cloud sleeps after ~12h inactivity)
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright & Chromium
        run: |
          pip install --quiet playwright
          playwright install chromium

      - name: Visit and wake Streamlit app
        env:
          STREAMLIT_URL: "https://pqcsimulation-group10.streamlit.app/"
        run: |
          python - <<'EOF'
          import os
          import sys
          import time
          from playwright.sync_api import sync_playwright

          url = os.environ["STREAMLIT_URL"]

          def find_wake_button(page):
              for ctx in [page, *page.frames]:
                  try:
                      btn = ctx.locator("button", has_text="Yes, get this app back up")
                      if btn.count() > 0 and btn.first.is_visible():
                          return btn.first
                  except Exception:
                      pass
              return None

          def is_app_rendered(page):
              for ctx in [page, *page.frames]:
                  try:
                      if ctx.locator('[data-testid="stAppViewContainer"]').count() > 0:
                          return True
                  except Exception:
                      pass
              return False

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(viewport={"width": 1280, "height": 800})
              page = context.new_page()

              print(f"Navigating to {url} ...")
              resp = page.goto(url, wait_until="domcontentloaded", timeout=60000)
              print(f"HTTP status: {resp.status if resp else 'unknown'}")

              # Allow initial Streamlit JS / iframe / sleep screen to render
              page.wait_for_timeout(8000)

              wake_btn = find_wake_button(page)
              if wake_btn is not None:
                  print("App is sleeping. Clicking wake-up button...")
                  wake_btn.click()
                  # Wait up to 90s for cold boot
                  deadline = time.time() + 90
                  while time.time() < deadline:
                      if is_app_rendered(page):
                          break
                      page.wait_for_timeout(3000)
              else:
                  # Wait up to 45s for active app container
                  deadline = time.time() + 45
                  while time.time() < deadline:
                      if is_app_rendered(page):
                          break
                      page.wait_for_timeout(2000)

              if not is_app_rendered(page):
                  print(f"ERROR: Streamlit app container did not render. Title={page.title()!r}")
                  browser.close()
                  sys.exit(1)

              # Keep WebSocket session open briefly so Streamlit registers real activity
              page.wait_for_timeout(5000)
              print(f"SUCCESS: App is awake and rendered. Title={page.title()!r}")
              browser.close()
          EOF
